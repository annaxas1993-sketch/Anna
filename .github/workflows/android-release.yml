name: Android APK Release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: platform-tools
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Validate server and driver JavaScript
        run: |
          node --check server/src/server.js
          python3 - <<'PY'
          import re
          from pathlib import Path
          html = Path("app/src/main/assets/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>', html, re.S | re.I)
          if not scripts:
              raise SystemExit("No inline driver script found")
          Path("/tmp/taxi-lider-driver.js").write_text("\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/taxi-lider-driver.js
          python3 -m json.tool server/package.json >/dev/null
      - name: Build installable APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify APK contents
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -l "$APK" | grep -q 'assets/index.html'
          unzip -l "$APK" | grep -q 'classes.dex'
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -E "package: name='am.axas.driver'|sdkVersion:'23'"
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk TAXI-LIDER-Driver-${{ github.run_number }}.apk
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: TAXI-LIDER-Driver-APK
          path: TAXI-LIDER-Driver-${{ github.run_number }}.apk
          retention-days: 30
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: taxi-lider-build-${{ github.run_number }}
          name: TAXI LIDER Driver build ${{ github.run_number }}
          generate_release_notes: true
          files: TAXI-LIDER-Driver-${{ github.run_number }}.apk
