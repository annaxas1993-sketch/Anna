name: Android APK Release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Build installable APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk TAXI-LIDER-Driver-${{ github.run_number }}.apk
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: TAXI-LIDER-Driver-APK
          path: TAXI-LIDER-Driver-${{ github.run_number }}.apk
          retention-days: 30
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: taxi-lider-build-${{ github.run_number }}
          name: TAXI LIDER Driver build ${{ github.run_number }}
          generate_release_notes: true
          files: TAXI-LIDER-Driver-${{ github.run_number }}.apk
