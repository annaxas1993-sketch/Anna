name: Build TAXI LIDER Android APK
on:
  push:
    branches: [main]
    paths:
      - 'expo/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: expo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Generate TAXI LIDER app logo
        run: |
          python -m pip install --quiet pillow
          python assets/generate_icon.py
      - name: Set Android build number
        run: node -e 'const fs=require("fs");const p="app.json";const j=JSON.parse(fs.readFileSync(p));j.expo.android.versionCode=Number(process.env.GITHUB_RUN_NUMBER);fs.writeFileSync(p,JSON.stringify(j,null,2)+"\n");'
      - name: Generate native Android project
        run: npx expo prebuild --platform android --non-interactive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure permanent Android release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing GitHub Actions secret: $name. Add the four permanent signing secrets in Settings > Secrets and variables > Actions."
              exit 1
            fi
          done
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/taxi-lider-upload.jks
          test -s android/app/taxi-lider-upload.jks
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path("android/app/build.gradle")
          s = p.read_text()
          signing = """signingConfigs {
                  release {
                      storeFile file("taxi-lider-upload.jks")
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }
          """
          if "signingConfigs {" not in s:
              raise SystemExit("Could not locate Android signingConfigs block")
          s = s.replace("signingConfigs {", signing + "\\nsigningConfigs {", 1)
          pattern = r"(release\\s*\\{.*?signingConfig\\s+)signingConfigs\\.debug"
          s, count = re.subn(pattern, r"\\1signingConfigs.release", s, count=1, flags=re.S)
          if count != 1:
              raise SystemExit("Could not switch the release build type to the permanent signing key")
          p.write_text(s)
          PY
      - name: Build release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: TAXI-LIDER-APK
          path: expo/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish downloadable TAXI LIDER APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: taxi-lider-build-${{ github.run_number }}
          name: TAXI LIDER APK #${{ github.run_number }}
          files: expo/android/app/build/outputs/apk/release/app-release.apk
          generate_release_notes: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
