name: Build TAXI LIDER Android APK
on:
  push:
    branches: [main]
    paths:
      - 'expo/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: expo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Generate TAXI LIDER app logo
        run: |
          python -m pip install --quiet pillow
          python assets/generate_icon.py
      - name: Generate native Android project
        run: npx expo prebuild --platform android --non-interactive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: TAXI-LIDER-APK
          path: expo/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish downloadable TAXI LIDER APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: taxi-lider-build-${{ github.run_number }}
          name: TAXI LIDER APK #${{ github.run_number }}
          files: expo/android/app/build/outputs/apk/release/app-release.apk
          generate_release_notes: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
