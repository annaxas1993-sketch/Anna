name: Build TAXI LIDER Dispatcher APK
on:
  push:
    branches: [main]
    paths:
      - 'dispatcher/**'
      - '.github/workflows/build-dispatcher-apk.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-dispatcher:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dispatcher
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dispatcher/package.json
      - name: Install dependencies
        run: npm install
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set Android build number
        run: node -e 'const fs=require("fs");const p="app.json";const j=JSON.parse(fs.readFileSync(p));j.expo.android.versionCode=Number(process.env.GITHUB_RUN_NUMBER);fs.writeFileSync(p,JSON.stringify(j,null,2));'
      - name: Generate native Android project
        run: CI=1 npx expo prebuild --platform android
      - name: Build release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: TAXI-LIDER-DISPATCHER-APK
          path: dispatcher/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish downloadable dispatcher APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: taxi-lider-dispatcher-build-${{ github.run_number }}
          name: TAXI LIDER Dispatcher APK #${{ github.run_number }}
          files: dispatcher/android/app/build/outputs/apk/release/app-release.apk
          generate_release_notes: false
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
