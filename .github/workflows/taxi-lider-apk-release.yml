name: Build Signed TAXI LIDER APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install dependencies
        run: npm install
      - name: Create Android project
        run: if [ ! -d android ]; then npx cap add android; fi
      - name: Set Android permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml')
          s=p.read_text()
          for perm in ['android.permission.INTERNET','android.permission.ACCESS_NETWORK_STATE']:
              if perm not in s:
                  s=s.replace('<application',f'<uses-permission android:name="{perm}" />\n<application',1)
          if 'android:usesCleartextTraffic' not in s:
              s=s.replace('<application','<application android:usesCleartextTraffic="true"',1)
          p.write_text(s)
          PY
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Build release APK
        run: |
          cd android
          ./gradlew assembleRelease
      - name: Sign APK with generated key and verify
        run: |
          cd android
          KEYSTORE="$RUNNER_TEMP/lider-release.jks"
          PASS="$RUNNER_TEMP/lider-pass.txt"
          echo "temporary-build-password" > "$PASS"
          keytool -genkeypair -v -keystore "$KEYSTORE" -alias lider -keyalg RSA -keysize 2048 -validity 10000 -storepass "temporary-build-password" -keypass "temporary-build-password" -dname "CN=TAXI LIDER"
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -n1)
          "$BUILD_TOOLS/zipalign" -p -f 4 "$APK" app-release-aligned.apk
          "$BUILD_TOOLS/apksigner" sign --ks "$KEYSTORE" --ks-key-alias lider --ks-pass pass:temporary-build-password --key-pass pass:temporary-build-password --out app-release-signed.apk app-release-aligned.apk
          "$BUILD_TOOLS/apksigner" verify app-release-signed.apk
      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TAXI-LIDER-SIGNED-APK
          path: android/app-release-signed.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: lider-release-${{ github.run_number }}
          name: TAXI LIDER signed APK ${{ github.run_number }}
          body: Build from supplied ZIP project. APK signature is generated for this build.
          files: android/app-release-signed.apk
          make_latest: true
