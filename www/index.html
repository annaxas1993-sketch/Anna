<!DOCTYPE html>
<html lang="hy"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#0b0e17"><title>TAXI LIDER Driver</title><style>
*{box-sizing:border-box}body{margin:0;background:#0b0e17;color:#f8fafc;font-family:system-ui,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}.wrap{max-width:420px;width:100%;text-align:center}.logo{font-size:34px;font-weight:900;color:#facc15;margin-bottom:20px}.panel{background:#151c2a;border-radius:20px;padding:22px;box-shadow:0 10px 35px #0005}.status{font-size:16px;margin:10px 0;color:#e2e8f0}.sub{font-size:12px;color:#94a3b8;margin:12px 0}button{margin-top:16px;padding:14px 20px;border-radius:12px;border:0;background:#facc15;color:#111827;font-weight:800;font-size:15px;width:100%}</style></head><body><div class="wrap"><div class="logo">LD · TAXI LIDER</div><div class="panel"><div class="status" id="status">Միանում ենք TAXI LIDER սերվերին…</div><div class="sub">Հավելվածը օգտագործում է հեռախոսի տեղական TAXI LIDER սերվերը՝ 127.0.0.1:3000</div><button onclick="connect()">Միանալ սերվերին</button></div></div><script>
function connect(){let s=document.getElementById('status');s.textContent='Սերվերի ստուգում…';fetch('http://127.0.0.1:3000/api/gps',{cache:'no-store'}).then(()=>location.replace('http://127.0.0.1:3000/driver.html')).catch(()=>{s.textContent='Սերվերը չի արձագանքում։ Միացրեք TAXI LIDER սերվերը հեռախոսում և կրկին փորձեք։'})}
setTimeout(connect,900);
</script></body></html>
