<!doctype html>
<html lang="hy"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#101117"><title>TAXI LIDER</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>
*{box-sizing:border-box}body{margin:0;background:#101117;color:#f1f2ff;font:15px system-ui,Arial}.app{max-width:560px;margin:auto;height:100dvh;display:flex;flex-direction:column}.head{padding:14px;background:#191d2b;font-weight:800;color:#f5bd20}.map{flex:1;position:relative;min-height:300px}#map{height:100%;width:100%}.search{position:absolute;z-index:500;top:12px;left:12px;right:66px;display:flex;background:#fff;border-radius:14px;padding:5px}.search input{min-width:0;flex:1;border:0;padding:10px;color:#172033}.search button{background:#ffd21f;border-radius:10px;padding:8px;font-size:20px}.tools{position:absolute;z-index:500;right:12px;top:70px;display:grid;gap:8px}.tools button{width:46px;height:46px;border-radius:50%;background:white;color:#172033;font-size:20px;font-weight:bold}.status{position:absolute;z-index:500;bottom:12px;left:12px;right:12px;background:#fff;color:#172033;border-radius:16px;padding:12px;box-shadow:0 3px 12px #0003}.controls{background:#191d2b;padding:14px}.toggle{padding:14px;border-radius:16px;background:#27c978;color:#09180e;font-weight:800;width:100%;border:0}.toggle.off{background:#34394d;color:white}.note{font-size:12px;color:#9298b0;text-align:center;margin-top:8px}.arrow{font-size:28px;color:#ffce00;text-shadow:0 1px 3px #222}</style></head><body><main class="app"><header class="head">🟥 TAXI LIDER · ՎԱՐՈՐԴ</header><div class="map"><div id="map"></div><div class="search"><input id="q" placeholder="Որոնել հասցե կամ վայր" autocomplete="off"><button onclick="search()">⌕</button></div><div class="tools"><button onclick="locate()">➤</button><button onclick="map.zoomIn()">＋</button><button onclick="map.zoomOut()">－</button><button onclick="clearTrip()">✕</button></div><div class="status" id="status">GPS-ը միացրեք կամ ընտրեք հասցեն</div></div><div class="controls"><button id="online" class="toggle" onclick="toggleOnline()">● Գործում եք · առցանց</button><div class="note">Քարտեզ՝ OpenStreetMap · երթուղի՝ OSRM · հասցե՝ Photon</div></div></main><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
let map=L.map('map',{zoomControl:false}).setView([40.1792,44.4991],14);L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',{maxZoom:20,attribution:'© OpenStreetMap'}).addTo(map);let pos=null,dest=null,marker=null,dmarker=null,line=null,watch=null,online=true,last=null;
function status(s){document.getElementById('status').textContent=s}
function bearing(a,b){let r=x=>x*Math.PI/180,d=r(b[1]-a[1]),la=r(a[0]),lb=r(b[0]);return (Math.atan2(Math.sin(d)*Math.cos(lb),Math.cos(la)*Math.sin(lb)-Math.sin(la)*Math.cos(lb)*Math.cos(d))*180/Math.PI+360)%360}
function icon(h){return L.divIcon({className:'',html:'<div class="arrow" style="transform:rotate('+h+'deg)">▲</div>',iconSize:[36,36],iconAnchor:[18,18]})}
function update(p,center){let c=p.coords,n=[c.latitude,c.longitude];if(last&&(!Number.isFinite(c.heading)||c.heading<0)&&Math.hypot(n[0]-last[0],n[1]-last[1])>0.00003)c.heading=bearing(last,n);let h=c.heading>=0&&Number.isFinite(c.heading)?c.heading:0;pos=n;last=n;if(!marker)marker=L.marker(n,{icon:icon(h)}).addTo(map);else{marker.setLatLng(n);marker.setIcon(icon(h))}if(center)map.setView(n,17);status('GPS · ±'+Math.round(c.accuracy||0)+' մ · '+(c.speed==null?'':Math.round(c.speed*3.6)+' կմ/ժ'));if(dest)route()}
function locate(){if(!navigator.geolocation)return status('GPS հասանելի չէ');navigator.geolocation.getCurrentPosition(p=>{update(p,true);if(watch===null)watch=navigator.geolocation.watchPosition(p=>update(p,false),e=>status('GPS ազդանշան չկա'),{enableHighAccuracy:true,maximumAge:1000,timeout:20000})},e=>status('Թույլատրեք GPS հասանելիությունը'),{enableHighAccuracy:true,timeout:15000,maximumAge:0})}
async function search(){let q=document.getElementById('q').value.trim();if(!q)return;status('Հասցեն որոնվում է…');try{let r=await fetch('https://photon.komoot.io/api/?limit=5&lang=hy&q='+encodeURIComponent(q));let j=await r.json(),f=j.features&&j.features[0];if(!f)throw 0;dest=[f.geometry.coordinates[1],f.geometry.coordinates[0]];if(dmarker)map.removeLayer(dmarker);dmarker=L.marker(dest).addTo(map);map.setView(dest,16);if(pos)route();else status('Նպատակակետ ընտրված է · միացրեք GPS')}catch(e){status('Հասցեն չգտնվեց')}}document.getElementById('q').addEventListener('keydown',e=>{if(e.key==='Enter')search()});
async function route(){if(!pos||!dest)return;try{let r=await fetch('https://router.project-osrm.org/route/v1/driving/'+pos[1]+','+pos[0]+';'+dest[1]+','+dest[0]+'?overview=full&geometries=geojson');let j=await r.json();if(!j.routes||!j.routes[0])throw 0;if(line)map.removeLayer(line);line=L.polyline(j.routes[0].geometry.coordinates.map(c=>[c[1],c[0]]),{color:'#1677ff',weight:6}).addTo(map);map.fitBounds(line.getBounds(),{padding:[40,40]});status('Երթուղի · '+(j.routes[0].distance/1000).toFixed(1)+' կմ · '+Math.round(j.routes[0].duration/60)+' րոպե')}catch(e){status('Երթուղին հասանելի չէ')}}
map.on('click',e=>{dest=[e.latlng.lat,e.latlng.lng];if(dmarker)map.removeLayer(dmarker);dmarker=L.marker(dest).addTo(map);if(pos)route()});
function clearTrip(){dest=null;if(line)map.removeLayer(line);line=null;if(dmarker)map.removeLayer(dmarker);dmarker=null;status('Երթուղին մաքրված է')}
function toggleOnline(){online=!online;let b=document.getElementById('online');b.textContent=online?'● Գործում եք · առցանց':'● Անջատված';b.classList.toggle('off',!online);status(online?'Առցանց կարգավիճակ':'Անցանց')}
if(navigator.geolocation&&window.isSecureContext)locate();window.addEventListener('resize',()=>map.invalidateSize());
</script></body></html>
